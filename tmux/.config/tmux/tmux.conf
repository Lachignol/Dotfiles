##### =========================
##### TMUX PLUGINS (TPM)
##### =========================

# TPM = gestionnaire de plugins pour tmux
# Il permet d'installer et gérer facilement des extensions tmux

# Plugin manager obligatoire (TPM lui-même)
set -g @plugin 'tmux-plugins/tpm'

# Plugin de base qui améliore les comportements par défaut de tmux
# (meilleures options clavier, scroll, compatibilité terminal, etc.)
set -g @plugin 'tmux-plugins/tmux-sensible'

# Sauvegarde manuelle des sessions tmux (windows, panes, programmes)
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Sauvegarde automatique des sessions + restauration au redémarrage
set -g @plugin 'tmux-plugins/tmux-continuum'


# Plugin pour avoir les mappng comme neovim
set -g @plugin 'christoomey/vim-tmux-navigator'

# navigation keys (optionnel mais recommandé)
set -g @vim_navigator_mapping_left "C-h C-Left"
set -g @vim_navigator_mapping_right "C-l C-Right"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"

# désactive le mapping C-\ (optionnel)
set -g @vim_navigator_mapping_prev ""

# évite conflit avec clear screen
set -g @vim_navigator_prefix_mapping_clear_screen ""


##### =========================
##### CONFIG RESURRECT / CONTINUUM
##### =========================

# Active la restauration automatique au démarrage de tmux
set -g @continuum-restore 'on'

# Sauvegarde automatique toutes les 10 minutes
set -g @continuum-save-interval '10'


##### =========================
##### RACCOURCIS RESURRECT
##### =========================

# Sauvegarder manuellement la session actuelle
bind S run '~/.tmux/plugins/tmux-resurrect/scripts/save.sh'
# Restaurer une session sauvegardée
bind R run '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'


##### =========================
##### INITIALISATION TPM
##### =========================

# Charge TPM et les plugins installés
# DOIT être à la fin du fichier sinon ça ne marche pas
run '~/.tmux/plugins/tpm/tpm'

