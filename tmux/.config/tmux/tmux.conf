# Raccourcis pour redimensionner les panneaux (Alt + flèches)
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5

# 2. Ouvrir les nouveaux panneaux et fenêtres dans le MÊME dossier
# Par défaut, Tmux ouvre les fenêtres dans ton dossier "Home".
# Ces lignes forcent Tmux à rester là où tu es en train de travailler :
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h "#{pane_current_path}"

# 3. Raccourcis plus visuels pour découper l'écran (Splits)
# Utilise | pour couper verticalement et - pour couper horizontalement
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %


# Mode VIM
set-window-option -g mode-keys vi
# Forcer la gestion des couleurs (important pour Neovim)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"
set -g set-clipboard on
set-option -g allow-rename off
set -g base-index 1
setw -g pane-base-index 1
set -g mode-style "bg=#444444,fg=#ffffff"

# Renuméroter automatiquement les fenêtres quand on en ferme une
set -g renumber-windows on

# entrer copy-mode
bind [ copy-mode

# sélection style Vim
bind -T copy-mode-vi v send-keys -X begin-selection

# yank (copier)
bind -T copy-mode-vi y send-keys -X copy-selection

# copier + quitter (comme Enter dans beaucoup de setups)
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# quitter copy-mode
bind -T copy-mode-vi q send-keys -X cancel

# pas de delai pour la touche esc
set -sg escape-time 0

# # copy-mode multi-os
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy || xclip -selection clipboard || wl-copy"
